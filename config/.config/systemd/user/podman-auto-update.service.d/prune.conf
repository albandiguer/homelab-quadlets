# Runs before the daily podman auto-update so a failing registry check
# (minio/n8n) can't skip it the way the shipped ExecStartPost does.
#
# Both commands prune only UNUSED images: podman skips any image referenced by
# a container (running or stopped) and never touches image parents. `-f` only
# skips the confirmation prompt. The 30-day age filter keeps a rollback window.
[Service]
ExecStartPre=/usr/bin/podman image prune -f
ExecStartPre=/usr/bin/podman image prune -a -f --filter until=720h
