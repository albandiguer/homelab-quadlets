# Discourse forum configuration.
# Loaded into the systemd user session and expanded in the quadlet files.
# This file ships non-secret values only; credentials live in Podman secrets.

# Canonical hostname. Discourse always builds links and emails with this host,
# whatever the request Host is, so this is the public forum address. The VPN
# names still proxy to the same container but render links to this host.
DISCOURSE_HOSTNAME=forum.molereskoak.org

# Comma-separated emails that become admins. The first account signing up
# with one of these addresses is promoted on first login.
DISCOURSE_DEVELOPER_EMAILS=alban.diguer@gmail.com

# Outbound mail: Brevo SMTP relay (300/day free). The key is a Podman secret
# (discourse_smtp_password), never this file.
DISCOURSE_SMTP_ADDRESS=smtp-relay.brevo.com
DISCOURSE_SMTP_PORT=587
DISCOURSE_SMTP_USER_NAME=bd983a001@smtp-brevo.com

# From-address for all Discourse mail. Brevo only accepts senders you verified:
# verify the molereskoak.org domain in Brevo (3 DNS records in the Cloudflare
# zone). Until then, mail is refused with "sender not valid".
DISCOURSE_NOTIFICATION_EMAIL=noreply@molereskoak.org
